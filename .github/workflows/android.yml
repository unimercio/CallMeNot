name: Android Build & APK Generator

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        id: gradle_build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallGuard-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CallGuard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Write Build Summary
        if: always()
        shell: bash
        run: |
          echo "## CallMeNot Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch/ref: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gradle_build.outcome }}" = "success" ]; then
            echo "- Result: ✅ BUILD SUCCESSFUL" >> "$GITHUB_STEP_SUMMARY"
            echo "- APK artifact: \`CallGuard-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: ❌ BUILD FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "- Diagnostic artifact: \`CallGuard-gradle-build-log\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### First likely error lines" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E -m 20 "(^e: |FAILURE:|Caused by:|Execution failed for task|Could not resolve|error:)" gradle-build.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
